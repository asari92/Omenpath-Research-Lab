services:
  omenpath:
    build:
      context: .
      dockerfile: Dockerfile
    image: omenpath:local
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: /opt/omenpath/data
        target: /var/lib/omenpath
    restart: unless-stopped
    init: true
